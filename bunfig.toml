[fmt]
printWidth = 100
tabWidth = 2
useTabs = false
semi = true
singleQuote = false
trailingComma = "all"
sortImports = true
ignorePatterns = ["src/components/ui/**"]

[lint]
ignorePatterns = ["src/components/ui/**"]

[lint.rules]
"@typescript-eslint/no-non-null-assertion" = "off"
"@typescript-eslint/no-explicit-any" = "warn"
"react-hooks/exhaustive-deps" = "warn"
